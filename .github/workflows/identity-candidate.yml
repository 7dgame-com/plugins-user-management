name: Identity development candidate

on:
  push:
    branches: [codex/identity-online-dev-20261012]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish only this commit's candidate image (no deployment)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: identity-candidate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  HUSKY: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Guard candidate source
        env:
          CANDIDATE_REF: ${{ github.ref }}
        run: |
          test "$CANDIDATE_REF" = refs/heads/codex/identity-online-dev-20261012
          test "$GITHUB_EVENT_NAME" = push || test "$GITHUB_EVENT_NAME" = workflow_dispatch
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  candidate:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: user-manager
            image: hkccr.ccs.tencentyun.com/plugins/user-manager
            context: .
            file: ./Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in for candidate publication
        if: github.event_name == 'push' || inputs.publish_candidate == true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USER }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
      - name: Build this commit's candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.publish_candidate == true }}
          tags: ${{ matrix.image }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          provenance: true
          cache-from: type=gha,scope=identity-candidate-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=identity-candidate-${{ matrix.name }}
      - name: Record source and image digest
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_IMAGE: ${{ matrix.image }}:candidate-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ github.event_name == 'push' || inputs.publish_candidate == true }}
        run: |
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg image "$CANDIDATE_IMAGE" \
            --arg digest "$IMAGE_DIGEST" \
            --argjson published "$PUBLISHED" \
            '{sourceSha: $sourceSha, repository: $repository, image: $image, digest: $digest, platform: "linux/amd64", published: $published}' \
            > candidate-image.json
          printf 'Candidate: `%s`\n\nSource: `%s`\n\nDigest: `%s`\n\nPublished: `%s`\n' \
            "$CANDIDATE_IMAGE" "$SOURCE_SHA" "$IMAGE_DIGEST" "$PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.name }}-${{ github.sha }}
          path: candidate-image.json
          retention-days: 30
